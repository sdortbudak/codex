{% extends 'layout.html' %}
{% block content %}
<form method="post">
  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Brand</label>
      <input name="brand" class="form-control">
    </div>
    <div class="col-md-4 mb-3">
      <label>Model</label>
      <input name="model" class="form-control">
    </div>
    <div class="col-md-4 mb-3">
      <label>Year</label>
      <input name="year" class="form-control" type="number">
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Engine CC</label>
      <input name="engine_cc" class="form-control" type="number">
    </div>
    <div class="col-md-4 mb-3">
      <label>Cylinders</label>
      <input name="cylinders" class="form-control" type="number">
    </div>
    <div class="col-md-4 mb-3">
      <label>Transmission</label>
      <input name="transmission" class="form-control">
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Fuel Type</label>
      <input name="fuel_type" class="form-control">
    </div>
    <div class="col-md-4 mb-3">
      <label>Body Type</label>
      <input name="body_type" class="form-control">
    </div>
    <div class="col-md-4 mb-3">
      <label>Mileage</label>
      <input name="mileage" class="form-control" type="number">
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Color</label>
      <input name="color" class="form-control">
    </div>
    <div class="col-md-4 mb-3">
      <label>Plate</label>
      <input name="plate" class="form-control">
    </div>
    <div class="col-md-4 mb-3">
      <label>Paint Status</label>
      <input name="paint_status" class="form-control">
    </div>
  </div>
  <div class="mb-3">
    <label>Purchase Price</label>
    <input name="purchase_price" class="form-control" type="number">
  </div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
